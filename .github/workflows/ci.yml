name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build -w @hortis/shared
      - run: npm run build -w @hortis/care-engine
      - run: npm run build -w @hortis/garden-engine
      - run: npm run build -w @hortis/bonsai-engine
      - run: npm test
      - run: npm run build -w @hortis/web
      - run: npm run build -w @hortis/api

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hortis:ci .
